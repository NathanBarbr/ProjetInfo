[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for different test types
markers =
    unit: Unit tests (fast, isolated, mocked dependencies)
    integration: Integration tests (slower, real services like Elasticsearch)
    slow: Slow tests that take more than a few seconds

# Output options
addopts = 
    -v
    --strict-markers
    --disable-warnings
    --color=yes

# Asyncio mode for FastAPI tests
asyncio_mode = auto

# Coverage options (when using --cov)
[coverage:run]
source = routers
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
